<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gratis account aanmaken · OMRZ Digital</title>
  <meta name="description" content="Maak gratis een OMRZ Digital account aan en probeer de digitale stempelkaart 14 dagen zonder kosten." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #0a0a0a;
      --text: #ffffff;
      --muted: #a0a0a0;
      --pearl: #e8e8e8;
      --card: rgba(255, 255, 255, .05);
      --border: rgba(255, 255, 255, .1);
      --border-strong: rgba(255, 255, 255, .18);
      --radius: 18px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font); background: var(--bg); color: var(--text);
      line-height: 1.6; font-size: 17px; min-height: 100vh; overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column;
    }
    a { color: inherit; text-decoration: none; }

    /* Subtiele achtergrond-gloed */
    body::before {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(700px 460px at 78% -10%, rgba(255,255,255,.06), transparent 60%),
        radial-gradient(680px 460px at 10% 8%, rgba(255,255,255,.04), transparent 60%);
    }

    .topbar { padding: 26px 24px; }
    .brand { font-size: 20px; font-weight: 800; letter-spacing: -.02em; color: #fff; display: inline-flex; align-items: center; gap: 10px; }
    .brand-logo { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; object-position: center; flex-shrink: 0; }

    .auth-wrap {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 20px 24px 60px;
    }
    .auth-card {
      width: 100%; max-width: 460px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 40px 36px;
      backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
      box-shadow: 0 30px 80px rgba(0,0,0,.5);
    }
    .auth-badge {
      display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600;
      color: #d6f5e2; padding: 6px 13px; border-radius: 999px;
      border: 1px solid rgba(74,222,128,.4); background: rgba(74,222,128,.1); margin-bottom: 20px;
    }
    .auth-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 10px #4ade80; }
    .auth-card h1 {
      font-size: 27px; font-weight: 800; letter-spacing: -.03em; margin-bottom: 8px; line-height: 1.15;
    }
    .auth-sub { color: var(--muted); font-size: 15px; margin-bottom: 24px; }

    /* Voordelen */
    .benefits { display: grid; gap: 11px; margin-bottom: 26px; padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,.03); border: 1px solid var(--border); }
    .benefit { display: flex; align-items: center; gap: 11px; font-size: 14px; color: var(--pearl); }
    .benefit svg { width: 18px; height: 18px; color: #6ee7a0; flex-shrink: 0; }

    .field { margin-bottom: 18px; }
    .field label {
      display: block; font-size: 13px; font-weight: 600; color: var(--pearl);
      margin-bottom: 8px; letter-spacing: .01em;
    }
    .field input {
      width: 100%; font-family: inherit; font-size: 15px; color: #fff;
      background: rgba(255,255,255,.04); border: 1px solid var(--border-strong);
      border-radius: 12px; padding: 14px 16px; transition: border-color .25s var(--ease), background .25s var(--ease);
    }
    .field input::placeholder { color: #6a6a6a; }
    .field input:focus { outline: none; border-color: #fff; background: rgba(255,255,255,.07); }
    .field input.invalid { border-color: rgba(255,80,80,.5); }
    .field-hint { font-size: 12.5px; color: var(--muted); margin-top: 7px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    .check-row {
      display: flex; align-items: flex-start; gap: 11px; margin: 4px 0 24px;
      font-size: 13.5px; color: var(--muted); line-height: 1.5;
    }
    .check-row input { width: 18px; height: 18px; margin-top: 2px; accent-color: #fff; flex-shrink: 0; cursor: pointer; }
    .check-row a { color: #fff; text-decoration: underline; text-underline-offset: 2px; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      font-family: inherit; font-size: 15px; font-weight: 700; line-height: 1.25; text-align: center;
      padding: 16px 24px; border-radius: 12px; border: 1px solid transparent; cursor: pointer;
      transition: transform .25s var(--ease), background .25s var(--ease), box-shadow .3s var(--ease), opacity .2s var(--ease);
    }
    .btn-primary { background: #ffffff; color: #0a0a0a; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(255,255,255,.18); }
    .btn-primary:disabled { opacity: .55; cursor: default; transform: none; box-shadow: none; }
    .btn-block { width: 100%; }

    .auth-msg {
      display: none; font-size: 14px; padding: 12px 14px; border-radius: 11px; margin-bottom: 20px;
    }
    .auth-msg.error { display: block; color: #ffb4b4; background: rgba(255,80,80,.08); border: 1px solid rgba(255,80,80,.25); }
    .auth-msg.ok { display: block; color: #b4ffcf; background: rgba(80,255,140,.08); border: 1px solid rgba(80,255,140,.25); }

    .auth-alt {
      text-align: center; color: var(--muted); font-size: 14.5px; margin-top: 26px;
      padding-top: 22px; border-top: 1px solid var(--border);
    }
    .auth-alt a { color: #fff; font-weight: 600; }
    .auth-alt a:hover { text-decoration: underline; }

    .spinner {
      width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid rgba(10,10,10,.3); border-top-color: #0a0a0a;
      animation: spin .7s linear infinite; display: none;
    }
    .btn.loading .spinner { display: inline-block; }
    .btn.loading .btn-label { opacity: .7; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 480px) {
      .auth-card { padding: 32px 24px; }
      .field-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <a href="index.html" class="brand"><img class="brand-logo" src="images/gold-logo.png" alt="OMRZ Digital logo" />OMRZ Digital</a>
  </div>

  <main class="auth-wrap">
    <div class="auth-card">
      <span class="auth-badge"><span class="dot"></span>14 dagen gratis proberen</span>
      <h1>Maak je gratis account aan</h1>
      <p class="auth-sub">Start vandaag met je digitale stempelkaart. Geen creditcard nodig.</p>

      <div class="benefits">
        <div class="benefit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>14 dagen volledig gratis uitproberen</div>
        <div class="benefit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Geen kosten tijdens de proefperiode</div>
        <div class="benefit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>In één minuut klaar — direct aan de slag</div>
      </div>

      <div class="auth-msg" id="authMsg"></div>

      <form id="registerForm" novalidate>
        <div class="field">
          <label for="business">Bedrijfsnaam</label>
          <input type="text" id="business" name="business" placeholder="Café OMRZ" autocomplete="organization" required />
        </div>

        <div class="field">
          <label for="email">E-mailadres</label>
          <input type="email" id="email" name="email" placeholder="jij@zaak.nl" autocomplete="email" required />
        </div>

        <div class="field-row">
          <div class="field">
            <label for="password">Wachtwoord</label>
            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="new-password" required />
          </div>
          <div class="field">
            <label for="password2">Bevestig wachtwoord</label>
            <input type="password" id="password2" name="password2" placeholder="••••••••" autocomplete="new-password" required />
          </div>
        </div>
        <div class="field-hint" style="margin-top:-8px; margin-bottom:18px;">Minimaal 8 tekens.</div>

        <label class="check-row">
          <input type="checkbox" id="terms" />
          <span>Ik ga akkoord met de <a href="voorwaarden.html" target="_blank" rel="noopener">algemene voorwaarden</a> en het <a href="privacy.html" target="_blank" rel="noopener">privacybeleid</a>.</span>
        </label>

        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
          <span class="spinner"></span>
          <span class="btn-label">Account aanmaken &amp; 14 dagen gratis proberen</span>
        </button>
      </form>

      <p class="auth-alt">Al een account? <a href="login.html">Inloggen</a></p>
    </div>
  </main>

  <script>
    const API_BASE = 'https://ai-review-bot-production.up.railway.app';

    const form = document.getElementById('registerForm');
    const submitBtn = document.getElementById('submitBtn');
    const msg = document.getElementById('authMsg');
    const $ = (id) => document.getElementById(id);

    function showMsg(text, type) { msg.textContent = text; msg.className = 'auth-msg ' + type; }
    function clearMsg() { msg.className = 'auth-msg'; msg.textContent = ''; }
    function markInvalid(id) { $(id).classList.add('invalid'); }
    function clearInvalid() { form.querySelectorAll('input.invalid').forEach(el => el.classList.remove('invalid')); }
    const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearMsg(); clearInvalid();

      const business = $('business').value.trim();
      const email = $('email').value.trim();
      const password = $('password').value;
      const password2 = $('password2').value;
      const agreed = $('terms').checked;

      // ---- Validatie ----
      if (!business) { markInvalid('business'); return showMsg('Vul je bedrijfsnaam in.', 'error'); }
      if (!EMAIL_RE.test(email)) { markInvalid('email'); return showMsg('Vul een geldig e-mailadres in.', 'error'); }
      if (password.length < 8) { markInvalid('password'); return showMsg('Je wachtwoord moet minimaal 8 tekens bevatten.', 'error'); }
      if (password !== password2) { markInvalid('password2'); return showMsg('De wachtwoorden komen niet overeen.', 'error'); }
      if (!agreed) { return showMsg('Ga akkoord met de voorwaarden en het privacybeleid om verder te gaan.', 'error'); }

      submitBtn.disabled = true;
      submitBtn.classList.add('loading');

      try {
        const res = await fetch(API_BASE + '/api/stamp/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ business_name: business, email, password }),
        });
        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          // Duidelijke melding, met een herkenbaar bericht voor "e-mail bestaat al".
          let m = data.error || data.message || 'Account aanmaken mislukt. Probeer het opnieuw.';
          const low = String(m).toLowerCase();
          if (res.status === 409 || low.includes('exist') || low.includes('already') || low.includes('bestaat') || low.includes('in gebruik') || low.includes('geregistreerd')) {
            m = 'Er bestaat al een account met dit e-mailadres. Log in of gebruik een ander e-mailadres.';
          }
          showMsg(m, 'error');
          submitBtn.disabled = false;
          submitBtn.classList.remove('loading');
          return;
        }

        // ---- Sessie opslaan (token-veldnaam robuust, evt. genest) ----
        const token = data.token || data.access_token || data.accessToken || data.jwt || data.jwt_token
          || data.authToken || (data.session && data.session.token)
          || (data.data && (data.data.token || data.data.access_token))
          || (data.user && data.user.token);
        if (token) localStorage.setItem('omrz_token', token);

        const cardIdVal = data.card_id || data.cardId || (data.card && data.card.id)
          || (data.data && data.data.card_id);
        if (cardIdVal) localStorage.setItem('omrz_card_id', cardIdVal);

        localStorage.setItem('omrz_business_name', business);
        localStorage.setItem('omrz_email', email);

        showMsg('Account aangemaakt! Je wordt doorgestuurd…', 'ok');
        window.location.href = 'dashboard.html';
      } catch (err) {
        showMsg('Kan geen verbinding maken met de server. Controleer je verbinding en probeer het later opnieuw.', 'error');
        submitBtn.disabled = false;
        submitBtn.classList.remove('loading');
      }
    });
  </script>
</body>
</html>
